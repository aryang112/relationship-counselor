services:
  postgres:
    image: postgres:15-alpine
    container_name: relationship-app-postgres
    restart: unless-stopped
    ports:
      - "54320:5432"  # Using 54320 on host to avoid conflict with system PostgreSQL
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relationship_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: relationship-app-postgres-data
